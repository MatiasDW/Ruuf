# SEC-102 — Gate de secretos en CI.
#
# `diff` bloquea: escanea solo los archivos que introduce o modifica el push/PR,
# tomando su contenido final. Un hallazgo historico ya aceptado (SEC-101) no
# puede volver a romper el build porque esos archivos no cambian.
# `history` es informativo: reporta y sube artefacto redactado, nunca falla.

name: Security secrets

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    name: Secretos en el diff (bloqueante)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver rango a escanear
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            head='${{ github.sha }}'
            base='${{ github.event.before }}'
          fi
          # Push inicial de una rama, force-push o workflow_dispatch: `before` no
          # existe o quedo huerfano. Se cae al primer padre y, si no hay, al
          # commit vacio, de modo que el gate siempre tiene un rango valido.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse --verify --quiet "${head}^" || git hash-object -t tree /dev/null)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Rango: $base..$head"

      - name: Escanear diff con gitleaks
        run: tools/security/scan-secrets.sh range "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

  history:
    name: Historia completa (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escanear historia (no bloquea)
        env:
          GITLEAKS_REPORT: ${{ runner.temp }}/gitleaks-history.json
        run: tools/security/scan-secrets.sh history

      - name: Publicar reporte redactado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-report
          path: ${{ runner.temp }}/gitleaks-history.json
          if-no-files-found: ignore
          retention-days: 14
