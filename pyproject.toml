[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
  "api",
  "audit",
  "catalog",
  "common",
  "config",
  "domain",
  "finance",
  "identity",
  "irrigation",
  "planning",
  "projects",
]

[tool.ruff.lint.per-file-ignores]
"backend/**/migrations/*.py" = ["E501", "RUF012"]
"backend/**/models.py" = ["RUF012"]
"backend/api/serializers.py" = ["RUF012"]
"backend/api/views.py" = ["RUF012"]
"backend/planning/compat_views.py" = ["RUF012"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.coverage.run]
branch = true
source = ["backend"]
omit = ["backend/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.mypy]
python_version = "3.12"
files = ["backend"]
mypy_path = "backend"
exclude = ["backend/.*/migrations/", "backend/tests/"]
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
