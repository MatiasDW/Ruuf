services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ruuf_landscape
      POSTGRES_USER: ruuf
      POSTGRES_PASSWORD: ruuf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruuf -d ruuf_landscape"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ruuf:ruuf@postgres:5432/ruuf_landscape
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      CORS_ORIGINS: http://localhost:5173
      STITCH_API_KEY: ${STITCH_API_KEY}
      STITCH_MCP_URL: ${STITCH_MCP_URL}
    ports:
      - "5050:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  redis_data:
